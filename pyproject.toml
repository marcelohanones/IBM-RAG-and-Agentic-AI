[project]
name = "ibm-rag-and-agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marcelo Hanones", email = "marcelohanones@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb==0.4.24",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain==0.3.30",
    "langchain-community==0.3.31",
    "langchain-experimental==0.3.4",
    "langchain-openai==0.3.35",
    "langchainhub==0.1.21",
    # Pinned: chromadb 0.4.24 uses the removed `np.float_` alias, incompatible with numpy>=2.0.
    "numpy<2",
    # Pinned: onnxruntime (a chromadb dependency) dropped macOS x86_64 wheels after 1.23.x.
    "onnxruntime==1.23.2",
    "openai>=2.53.0",
    "pandas>=3.0.5",
    "pypdf==4.2.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
ibm-rag-and-agentic-ai = "ibm_rag_and_agentic_ai:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
]
# F401 (unused import) fica visível como aviso mas nunca é removido no
# fix-on-save — nos notebooks de investigação, importar antes de usar é
# parte do fluxo (ex: probe/target/siblings do tetris2).
unfixable = ["F401"]
